<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Music Mania banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&family=Shrikhand&display=swap"
    />
    <style>
      /* The same tokens as app/globals.css. Keep them in step. */
      :root {
        --booth: #0e2f36;
        --booth-deep: #08222a;
        --booth-lift: #164550;
        --chrome: #b9cdd0;
        --paper: #fff3d6;
        --ink: #241713;
        --cherry: #e9383f;
        --butter: #ffc845;
        --seafoam: #6fd6bf;
        --vinyl: #14100f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      .banner {
        position: relative;
        width: 1280px;
        height: 640px;
        display: flex;
        align-items: center;
        padding: 0 84px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 62% 74% at 34% 52%, var(--booth-lift), transparent 70%),
          var(--booth-deep);
        font-family: 'Barlow', system-ui, sans-serif;
        color: var(--paper);
      }

      /* --- The record ------------------------------------------------------ */

      .stage {
        position: absolute;
        top: 37px;
        left: 662px;
        width: 566px;
        height: 566px;
      }

      .stage svg {
        position: absolute;
        inset: 0;
      }

      .record {
        position: absolute;
        inset: 13.8%; /* the disc, inside the halo box that overhangs it */
        border-radius: 50%;
        background:
          repeating-radial-gradient(circle, transparent 0 0.9%, rgb(255 255 255 / 0.045) 0.9% 1.15%),
          radial-gradient(circle, #2a2220 0 34%, var(--vinyl) 34.5% 100%);
        box-shadow:
          0 0 0 2px #000,
          0 26px 70px rgb(0 0 0 / 0.5);
      }

      /* The sheen, as on the live record. */
      .record::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 20deg,
          transparent 0 8%,
          rgb(255 255 255 / 0.13) 14%,
          transparent 21% 50%,
          rgb(255 255 255 / 0.09) 64%,
          transparent 71%
        );
      }

      .label {
        position: absolute;
        inset: 31%;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--cherry);
        color: var(--paper);
        font-family: 'Shrikhand', cursive;
        font-size: 72px;
        line-height: 1;
      }

      .label span {
        transform: translateY(-20px);
      }

      .label::before {
        content: '';
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        border: 2px dashed rgb(255 243 214 / 0.45);
      }

      .hole {
        position: absolute;
        inset: 47.6%;
        border-radius: 50%;
        background: var(--booth-deep);
        box-shadow: 0 0 0 2px rgb(0 0 0 / 0.5);
      }

      .sticker {
        position: absolute;
        top: 88px;
        left: 40px;
        display: grid;
        place-items: center;
        width: 130px;
        height: 130px;
        transform: rotate(-12deg);
        background: var(--seafoam);
        color: var(--ink);
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 27px;
        line-height: 1;
        letter-spacing: 0.02em;
        text-align: center;
        /* A 16-point price-sticker burst. */
        clip-path: polygon(
          50% 0%, 59% 9%, 69% 4%, 74% 15%, 85% 15%, 85% 26%, 96% 31%, 91% 41%, 100% 50%, 91% 59%,
          96% 69%, 85% 74%, 85% 85%, 74% 85%, 69% 96%, 59% 91%, 50% 100%, 41% 91%, 31% 96%, 26% 85%,
          15% 85%, 15% 74%, 4% 69%, 9% 59%, 0% 50%, 9% 41%, 4% 31%, 15% 26%, 15% 15%, 26% 15%, 31% 4%,
          41% 9%
        );
      }

      /* --- The words ------------------------------------------------------- */

      .words {
        position: relative;
        width: 660px;
      }

      .wordmark {
        display: inline-block;
        font-family: 'Shrikhand', cursive;
        font-size: 108px;
        line-height: 0.86;
        letter-spacing: 0.005em;
        color: var(--paper);
        text-shadow: 0.055em 0.055em 0 var(--cherry);
        transform: rotate(-3deg);
      }

      .wordmark span {
        display: block;
      }

      .wordmark span + span {
        margin-left: 0.55em;
        color: var(--butter);
      }

      .pitch {
        margin: 44px 0 0;
        max-width: 19em;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--chrome);
      }

      .pills {
        display: flex;
        gap: 12px;
        margin: 34px 0 0;
        padding: 0;
        list-style: none;
      }

      .pills li {
        padding: 7px 20px 5px;
        border-radius: 99px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 19px;
        line-height: 1.2;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="stage">
        <svg id="halo" aria-hidden="true"></svg>
        <div class="record">
          <div class="label"><span>?</span></div>
          <div class="hole"></div>
        </div>
        <div class="sticker">15<br />SEC</div>
      </div>

      <div class="words">
        <span class="wordmark"><span>Music</span><span>Mania</span></span>
        <p class="pitch">One screen plays the song. Everyone races to name it from their phone.</p>
        <ul class="pills">
          <li>10 SONGS</li>
          <li>UP TO 12 PHONES</li>
          <li>ONE QR CODE</li>
        </ul>
      </div>
    </div>

    <script>
      // The rays the music throws off the edge of the record, frozen on one
      // frame — the drawing components/host/Halo.tsx animates, plus the ring.
      const halo = document.getElementById('halo');
      const box = halo.clientWidth;
      halo.setAttribute('viewBox', `0 0 ${box} ${box}`);
      const centre = box / 2;
      const inner = box * 0.404;
      const reach = box * 0.092;
      const bars = 72;
      let markup =
        `<g stroke="#e9383f" stroke-width="${(box * 0.009).toFixed(2)}" stroke-linecap="round">`;
      for (let i = 0; i < bars; i++) {
        const half = i < bars / 2 ? i : bars - 1 - i;
        const level = Math.abs(Math.sin(half * 0.8) * 0.55 + Math.sin(half * 0.27) * 0.45);
        const length = reach * (0.18 + Math.pow(level, 1.3));
        const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
        const x1 = centre + Math.cos(angle) * inner;
        const y1 = centre + Math.sin(angle) * inner;
        const x2 = centre + Math.cos(angle) * (inner + length);
        const y2 = centre + Math.sin(angle) * (inner + length);
        markup +=
          `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" ` +
          `y2="${y2.toFixed(1)}" stroke-opacity="${(0.35 + level * 0.65).toFixed(2)}"/>`;
      }
      markup += '</g>';
      // The countdown ring, two thirds run down.
      const r = box * 0.376;
      const circumference = 2 * Math.PI * r;
      markup +=
        `<circle cx="${centre}" cy="${centre}" r="${r.toFixed(1)}" fill="none" stroke="#e9383f" ` +
        `stroke-width="${(box * 0.011).toFixed(2)}" stroke-linecap="round" ` +
        `stroke-dasharray="${(circumference * 0.66).toFixed(1)} ${circumference.toFixed(1)}" ` +
        `transform="rotate(-90 ${centre} ${centre})"/>`;
      halo.innerHTML = markup;
    </script>
  </body>
</html>
